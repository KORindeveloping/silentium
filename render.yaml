services:
  # Backend API Service
  - type: web
    name: silentium-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
        placeholder: "Enter your MongoDB Atlas URI here"
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
        placeholder: "Enter your Stripe Secret Key"
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Enter your Gemini API Key"
      - key: UPLOADS_PATH
        value: /opt/render/project/src/uploads
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  # Frontend Static Site
  - type: static
    name: silentium-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://silentium-api.onrender.com # This should be updated by the user if the name changes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
