services:
  # ---------------------------------------------------------------------------
  # 1. BACKEND (Web Service)
  # This service runs the Express server and stores the PDF files.
  # ---------------------------------------------------------------------------
  - type: web
    name: silentium-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist-server/server.js
    healthCheck:
      path: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: UPLOADS_PATH
        value: /opt/render/project/src/uploads
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  # ---------------------------------------------------------------------------
  # 2. FRONTEND (Static Site)
  # This service serves the compiled React/Vite app.
  # ---------------------------------------------------------------------------
  - type: static
    name: silentium-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # REPLACE THIS with your actual backend URL after the first deployment
        # Example: https://silentium-api.onrender.com
        value: https://silentium-api.onrender.com
    routes:
      - type: rewrite
        source: /uploads/(.*)
        destination: https://silentium-api.onrender.com/uploads/$1
      - type: rewrite
        source: /*
        destination: /index.html
